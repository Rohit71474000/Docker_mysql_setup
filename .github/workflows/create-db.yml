jobs:
  create-db:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Mysql@123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Wait for MySQL to be ready
        run: |
          for i in {30..0}; do
            mysqladmin ping -h 127.0.0.1 -p"$MYSQL_ROOT_PASSWORD" && break
            echo 'MySQL is unavailable - sleeping'
            sleep 1
          done

      - name: Run SQL script to create DB and table
        env:
          MYSQL_ROOT_PASSWORD: Mysql@123
        run: |
          mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" < sql/create_db_and_table.sql

